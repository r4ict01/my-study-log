<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学習ログ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="editor-panel" aria-labelledby="app-title">
        <div class="brand-row">
          <div>
            <p class="eyebrow">MY LEARNING LOG</p>
            <h1 id="app-title">学習ログ</h1>
          </div>
          <div class="save-state" id="save-state" aria-live="polite">未保存</div>
        </div>

        <form id="study-form" class="study-form">
          <div class="field-grid">
            <div>
              <label class="field-label" for="entry-date">学習日</label>
              <input id="entry-date" name="date" type="date" required />
            </div>
            <div>
              <label class="field-label" for="entry-subject">科目</label>
              <select id="entry-subject" name="subject" required>
                <option value="">選択してください</option>
                <option value="国語">国語</option>
                <option value="算数">算数</option>
                <option value="社会">社会</option>
                <option value="理科">理科</option>
                <option value="音楽">音楽</option>
                <option value="体育">体育</option>
                <option value="図工">図工</option>
                <option value="道徳">道徳</option>
                <option value="英語">英語</option>
                <option value="総合的な学習">総合的な学習</option>
              </select>
            </div>
          </div>

          <label class="field-label" for="entry-task">本時の課題</label>
          <input id="entry-task" name="task" type="text" maxlength="120" placeholder="例：分数のたし算の仕方を考える" required />

          <div class="field-grid">
            <div>
              <label class="field-label" for="entry-learning-method">学び方</label>
              <select id="entry-learning-method" name="learningMethod" required>
                <option value="">選択してください</option>
                <option value="一人で学ぶ">一人で学ぶ</option>
                <option value="友だちと学ぶ">友だちと学ぶ</option>
                <option value="先生と学ぶ">先生と学ぶ</option>
              </select>
            </div>
            <div>
              <label class="field-label" for="entry-understanding">目標とする姿</label>
              <select id="entry-understanding" name="understanding" required>
                <option value="">選択してください</option>
                <option value="5">よく理解できた</option>
                <option value="4">だいたい理解できた</option>
                <option value="3">ふつう</option>
                <option value="2">少し難しかった</option>
                <option value="1">まだ難しい</option>
              </select>
            </div>
          </div>

          <label class="field-label" for="entry-content">学習内容・気づき</label>
          <textarea id="entry-content" name="content" rows="5" maxlength="500" placeholder="学んだことや気づきを書いてみよう" required></textarea>

          <label class="field-label" for="entry-next-action">次にやること</label>
          <textarea id="entry-next-action" name="nextAction" rows="3" maxlength="240" placeholder="次回の学習で取り組むこと"></textarea>
          <div class="note-meta">
            <span id="editing-label">今日の学習記録を書いています</span>
            <span><span id="char-count">0</span>/500</span>
          </div>

          <div class="action-row">
            <button class="primary-button" type="submit">学習ログを保存</button>
            <button class="ghost-button" type="button" id="clear-button">入力をクリア</button>
          </div>
        </form>
      </section>

      <section class="history-panel" aria-labelledby="history-title">
        <div class="history-header">
          <div>
            <p class="eyebrow">MY PROGRESS</p>
            <h2 id="history-title">学習記録</h2>
          </div>
          <div class="stats-strip" aria-label="学習記録の件数">
            <strong id="entry-count">0</strong>
            <span>records</span>
          </div>
        </div>

        <section class="progress-card" aria-labelledby="progress-title">
          <div>
            <p class="progress-label" id="progress-title">学習のサマリー</p>
            <strong id="progress-message">記録を保存すると集計されます</strong>
          </div>
          <div class="progress-stats">
            <span>目標とする姿の平均 <strong id="average-understanding">-</strong>/5</span>
          </div>
        </section>

        <div class="summary-row" id="summary-row" aria-label="学び方の集計"></div>
        <div class="list-tools">
          <label class="search-box" for="search-input">
            <span>検索</span>
            <input id="search-input" type="search" placeholder="科目や内容から探す" />
          </label>
          <select id="subject-filter" aria-label="科目で絞り込み">
            <option value="all">すべての科目</option>
          </select>
        </div>

        <div id="empty-state" class="empty-state">
          <strong>まだ学習記録がありません</strong>
          <span>学んだことを保存すると、ここに表示されます。</span>
        </div>
        <ul id="entry-list" class="entry-list" aria-label="保存した学習記録一覧"></ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
